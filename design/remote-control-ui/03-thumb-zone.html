<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona del pulgar</title>
<style>
  :root{--bg:#1A1A1E;--surface:#25252B;--line:#45454D;--text:#F5F5F7;--muted:#A8A8B3;--accent:#4FD1D5;--accent-d:#00696D;--ok:#5BD68A;}
  *{box-sizing:border-box;margin:0}
  body{background:#0e0e10;display:grid;place-items:center;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
  .phone{width:412px;height:892px;background:var(--bg);display:flex;flex-direction:column;padding:14px;gap:10px}
  .top{display:flex;align-items:center;gap:10px;padding:2px 4px}
  .top .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
  .top b{flex:1;font-size:15px}
  .top small{color:var(--muted);font-size:12px}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,.pad:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .pad{flex:1;border-radius:20px;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,#2b2b32,#222228);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;line-height:1.6;position:relative}
  .scroll{position:absolute;right:10px;top:14px;bottom:14px;width:6px;border-radius:3px;background:var(--line)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
  .chips button{flex:0 0 auto;height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:#2a2a31;font-size:14px}
  .chips .sep{flex:0 0 1px;background:var(--line);margin:6px 2px}
  .bar{display:grid;grid-template-columns:1fr 64px 1fr;gap:10px;align-items:stretch}
  .click{height:76px;border-radius:20px;border:1px solid var(--line);background:#2d2d34;font-weight:650;font-size:15px;display:grid;place-items:center;line-height:1.2}
  .click small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
  .click:active{background:var(--accent-d)}
  .kbd{border-radius:20px;border:0;background:var(--accent-d);font-size:24px;display:grid;place-items:center}
  .status{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--muted)}
  .status em{font-style:normal;color:var(--ok)}
  .status button{border:0;background:transparent;color:#ff9b9b;font-size:13px;text-decoration:underline;padding:6px}
</style>
</head>
<body>
<main class="phone" aria-label="Control remoto">
  <div class="top"><span class="dot" aria-hidden="true"></span><b>omarchy</b><small>192.168.0.14</small></div>

  <div class="pad" tabindex="0" role="application" aria-label="Touchpad: desliza para mover, toca para clic">
    Desliza para mover<br>Toca = clic · 2 dedos = scroll
    <span class="scroll" aria-hidden="true"></span>
  </div>

  <div class="chips" role="toolbar" aria-label="Atajos">
    <button type="button">Ctrl+C</button><button type="button">Ctrl+V</button><button type="button">Ctrl+X</button><button type="button">Ctrl+Z</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button">Esc</button><button type="button">Enter</button><button type="button">Tab</button><button type="button">Supr</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" aria-label="Izquierda">←</button><button type="button" aria-label="Arriba">↑</button><button type="button" aria-label="Abajo">↓</button><button type="button" aria-label="Derecha">→</button>
  </div>

  <div class="bar">
    <button type="button" class="click">Izquierdo<small>clic</small></button>
    <button type="button" class="kbd" aria-label="Abrir teclado del celular">⌨</button>
    <button type="button" class="click">Derecho<small>clic</small></button>
  </div>

  <div class="status">
    <span>Portapapeles <em>● sincronizado</em> · imágenes: sí</span>
    <button type="button">Soltar</button>
  </div>
</main>
</body>
</html>
