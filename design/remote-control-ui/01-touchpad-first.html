<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touchpad primero</title>
<style>
  :root{--bg:#1A1A1E;--surface:#25252B;--line:#45454D;--text:#F5F5F7;--muted:#A8A8B3;--accent:#4FD1D5;--accent-d:#00696D;--ok:#5BD68A;}
  *{box-sizing:border-box;margin:0}
  body{background:#0e0e10;display:grid;place-items:center;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
  .phone{width:412px;height:892px;background:var(--bg);display:flex;flex-direction:column;padding:16px 14px 14px;gap:12px;position:relative;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:4px 4px 0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(91,214,138,.18)}
  .host{flex:1;min-width:0}
  .host b{display:block;font-size:17px}
  .host span{font-size:12.5px;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--muted);background:transparent}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,.pad:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .pad{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:22px;position:relative;display:grid;place-items:center;touch-action:none}
  .pad .hint{color:var(--muted);font-size:13px;text-align:center;line-height:1.5}
  .pad .scroll{position:absolute;right:0;top:0;bottom:0;width:36px;border-left:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;writing-mode:vertical-rl;letter-spacing:.12em}
  .clicks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .clicks button{height:60px;border-radius:16px;border:1px solid var(--line);background:#2d2d34;font-weight:600;font-size:15px}
  .clicks button:active{background:var(--accent-d)}
  .dock{display:grid;grid-template-columns:1fr auto;gap:10px}
  .kbd{height:56px;border-radius:16px;background:var(--accent-d);border:0;font-weight:650;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:10px}
  .more{height:56px;width:56px;border-radius:16px;border:1px solid var(--line);background:transparent;font-size:20px}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#202026;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 16px 18px;transform:translateY(100%);transition:transform .22s ease;z-index:5}
  .sheet.open{transform:none}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none}}
  .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
  .sheet h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:12px 0 8px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grid button{height:48px;border-radius:12px;border:1px solid var(--line);background:#2a2a31;font-size:14px}
  .clip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:14px}
  .clip small{color:var(--muted);display:block;font-size:12px;margin-top:2px}
  .sw{width:46px;height:28px;border-radius:14px;background:var(--accent-d);position:relative;border:0}
  .sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff}
  .release{margin-top:14px;width:100%;height:46px;border-radius:12px;border:1px solid #8a3b3b;color:#ff9b9b;background:transparent}
</style>
</head>
<body>
<main class="phone" aria-label="Control remoto">
  <header>
    <span class="dot" aria-hidden="true"></span>
    <div class="host"><b>omarchy</b><span>Conectado · 192.168.0.14</span></div>
    <span class="chip" aria-label="Portapapeles sincronizado">⎘ Sincronizado</span>
  </header>

  <div class="pad" role="application" aria-label="Touchpad: desliza para mover, toca para clic, dos dedos para desplazar" tabindex="0">
    <p class="hint">Desliza para mover<br>Toca = clic · 2 dedos = scroll</p>
    <div class="scroll" aria-hidden="true">SCROLL</div>
  </div>

  <div class="clicks">
    <button type="button">Clic izquierdo</button>
    <button type="button">Clic derecho</button>
  </div>

  <div class="dock">
    <button type="button" class="kbd" aria-label="Abrir teclado del celular">⌨ Teclado</button>
    <button type="button" class="more" id="toggle" aria-expanded="false" aria-controls="sheet" aria-label="Atajos y ajustes">⋯</button>
  </div>

  <section class="sheet" id="sheet" aria-label="Atajos y ajustes">
    <div class="grab"></div>
    <h2>Atajos</h2>
    <div class="grid">
      <button type="button">Ctrl+C</button><button type="button">Ctrl+V</button><button type="button">Ctrl+X</button><button type="button">Ctrl+Z</button>
      <button type="button">Esc</button><button type="button">Enter</button><button type="button">Tab</button><button type="button">Supr</button>
      <button type="button" aria-label="Izquierda">←</button><button type="button" aria-label="Arriba">↑</button><button type="button" aria-label="Abajo">↓</button><button type="button" aria-label="Derecha">→</button>
    </div>
    <h2>Portapapeles</h2>
    <div class="clip"><div>Sincronizar imágenes<small>Última sincronización hace 4 s</small></div><button type="button" class="sw" role="switch" aria-checked="true" aria-label="Sincronizar imágenes"></button></div>
    <button type="button" class="release">Soltar conexión</button>
  </section>
</main>
<script>
  const t=document.getElementById('toggle'),s=document.getElementById('sheet');
  t.addEventListener('click',()=>{const o=s.classList.toggle('open');t.setAttribute('aria-expanded',o);t.textContent=o?'✕':'⋯'});
</script>
</body>
</html>
