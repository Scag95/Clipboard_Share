<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona del pulgar v2</title>
<style>
  :root{--bg:#1A1A1E;--surface:#25252B;--line:#45454D;--text:#F5F5F7;--muted:#A8A8B3;--accent:#4FD1D5;--accent-d:#00696D;--ok:#5BD68A;--danger:#ff9b9b;}
  *{box-sizing:border-box;margin:0}
  body{background:#0e0e10;display:grid;place-items:center;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
  .phone{width:412px;height:892px;background:var(--bg);display:flex;flex-direction:column;padding:14px;gap:10px;position:relative;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,.surface:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* Header: host + one status badge that opens the connection panel */
  .top{display:flex;align-items:center;gap:10px;padding:2px 2px 0}
  .top .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
  .top b{flex:1;font-size:16px}
  .badge{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px}
  .badge .ok{color:var(--ok)}
  .badge[aria-expanded=true]{border-color:var(--accent)}

  .panel{position:absolute;top:62px;right:14px;left:14px;z-index:6;background:#202026;border:1px solid var(--line);border-radius:18px;padding:14px;display:none;box-shadow:0 18px 40px rgba(0,0,0,.5)}
  .panel.open{display:block}
  .panel .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .panel .row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .sw{width:46px;height:28px;border-radius:14px;background:var(--accent-d);position:relative;border:0;flex:none}
  .sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff}
  .release{margin-top:12px;width:100%;height:46px;border-radius:12px;border:1px solid #8a3b3b;background:transparent;color:var(--danger)}

  .pad{flex:1;border-radius:20px;border:1px solid var(--line);background:#222228;display:flex;flex-direction:column;overflow:hidden;min-height:0}
  .surface{flex:1;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;line-height:1.6;position:relative;background:radial-gradient(circle at 50% 40%,#2b2b32,#222228);min-height:0}
  .scroll{position:absolute;right:10px;top:14px;bottom:14px;width:6px;border-radius:3px;background:var(--line)}
  .clicks{display:grid;grid-template-columns:1fr 1fr;height:84px;border-top:1px solid var(--line)}
  .clicks button{border:0;background:#2d2d34;cursor:pointer}
  .clicks button+button{border-left:1px solid var(--line)}
  .clicks button:active{background:var(--accent-d)}
  .clicks button:focus-visible{outline-offset:-3px}

  /* Shortcuts: compact row, expands to a grid with a D-pad */
  .shortcuts{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:8px}
  .quick{display:grid;grid-template-columns:repeat(4,1fr) 48px;gap:6px}
  .quick button,.more button{height:46px;border-radius:12px;border:1px solid var(--line);background:#2d2d34;font-size:14px}
  .quick .exp{font-size:18px}
  .more{display:none;margin-top:8px;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
  .shortcuts.open .more{display:grid}
  .col{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,46px);gap:6px}
  .dpad .u{grid-column:2}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
  .dpad button{height:100%}

  .kbd{height:60px;border-radius:18px;border:0;background:var(--accent-d);font-size:16px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:10px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="phone" aria-label="Control remoto">
  <div class="top">
    <span class="dot" aria-hidden="true"></span><b>omarchy</b>
    <button type="button" class="badge" id="badge" aria-expanded="false" aria-controls="panel">⎘ <span class="ok">Al día</span> ▾</button>
  </div>

  <section class="panel" id="panel" aria-label="Conexión y portapapeles">
    <div class="row"><div>Conectado<small>192.168.0.14:8765</small></div><span style="color:var(--ok)">●</span></div>
    <div class="row"><div>Portapapeles<small>Última sincronización hace 4 s</small></div><span style="color:var(--ok);font-size:13px">Al día</span></div>
    <div class="row"><div>Sincronizar imágenes<small>Usa más datos en redes lentas</small></div><button type="button" class="sw" role="switch" aria-checked="true" aria-label="Sincronizar imágenes"></button></div>
    <button type="button" class="release">Soltar conexión</button>
  </section>

  <div class="pad" role="group" aria-label="Touchpad">
    <div class="surface" tabindex="0" role="application" aria-label="Superficie del touchpad: desliza para mover, toca para clic, dos dedos para desplazar">
      Desliza para mover<br>Toca = clic · 2 dedos = scroll
      <span class="scroll" aria-hidden="true"></span>
    </div>
    <div class="clicks">
      <button type="button" aria-label="Clic izquierdo"></button>
      <button type="button" aria-label="Clic derecho"></button>
    </div>
  </div>

  <section class="shortcuts" id="shortcuts" aria-label="Atajos">
    <div class="quick">
      <button type="button">Ctrl+C</button><button type="button">Ctrl+V</button><button type="button">Ctrl+X</button><button type="button">Ctrl+Z</button>
      <button type="button" class="exp" id="exp" aria-expanded="false" aria-controls="more" aria-label="Más atajos">▴</button>
    </div>
    <div class="more" id="more">
      <div class="col"><button type="button">Esc</button><button type="button">Enter</button><button type="button">Tab</button><button type="button">Supr</button></div>
      <div class="dpad"><button type="button" class="u" aria-label="Arriba">↑</button><button type="button" class="l" aria-label="Izquierda">←</button><button type="button" class="d" aria-label="Abajo">↓</button><button type="button" class="r" aria-label="Derecha">→</button></div>
    </div>
  </section>

  <button type="button" class="kbd" aria-label="Abrir teclado del celular">⌨ Teclado</button>
</main>
<script>
  const b=document.getElementById('badge'),p=document.getElementById('panel');
  b.addEventListener('click',()=>{const o=p.classList.toggle('open');b.setAttribute('aria-expanded',o)});
  const e=document.getElementById('exp'),s=document.getElementById('shortcuts');
  e.addEventListener('click',()=>{const o=s.classList.toggle('open');e.setAttribute('aria-expanded',o);e.textContent=o?'▾':'▴'});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&p.classList.contains('open')){p.classList.remove('open');b.setAttribute('aria-expanded',false);b.focus()}});
</script>
</body>
</html>
