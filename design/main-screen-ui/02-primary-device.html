<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispositivo principal</title>
<style>
  :root{--bg:#1A1A1E;--surface:#25252B;--line:#45454D;--text:#F5F5F7;--muted:#A8A8B3;--accent:#4FD1D5;--accent-d:#00696D;--ok:#5BD68A;}
  *{box-sizing:border-box;margin:0}
  body{background:#0e0e10;display:grid;place-items:center;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
  .phone{width:412px;height:892px;background:var(--bg);padding:22px 16px;display:flex;flex-direction:column;gap:16px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .top b{font-size:15px;color:var(--muted);font-weight:600}
  .rescan{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .hero{border-radius:26px;padding:22px;background:linear-gradient(160deg,#0b3c3f,#12383b 55%,#1c2a30);border:1px solid #1f5a5e;display:flex;flex-direction:column;gap:18px}
  .hero .tag{align-self:flex-start;font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(91,214,138,.14);color:var(--ok)}
  .hero h1{font-size:32px;letter-spacing:-.02em}
  .hero p{color:#b8d4d5;font-size:14px;margin-top:4px}
  .connect{height:60px;border-radius:18px;border:0;background:var(--accent);color:#06292b;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:12px 14px}
  .stat small{display:block;color:var(--muted);font-size:12px}
  .stat b{font-size:15px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-top:4px}
  .row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;cursor:pointer;text-align:left}
  .row span{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="phone">
  <div class="top"><b>Clipboard Share</b><button class="rescan" type="button">↻ Buscar de nuevo</button></div>

  <section class="hero" aria-label="Dispositivo recomendado">
    <span class="tag">● En red ahora</span>
    <div><h1>omarchy</h1><p>192.168.0.14 · último uso hace 2 min</p></div>
    <button class="connect" type="button">Conectar y controlar</button>
  </section>

  <div class="stats">
    <div class="stat"><small>Portapapeles</small><b>Al día</b></div>
    <div class="stat"><small>Segundo plano</small><b>Activo</b></div>
  </div>

  <h2>Otros dispositivos</h2>
  <button class="row" type="button">Portátil de la oficina <span>Sin respuesta · ayer</span></button>
</main>
</body>
</html>
