<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado primero</title>
<style>
  :root{--bg:#1A1A1E;--surface:#25252B;--line:#45454D;--text:#F5F5F7;--muted:#A8A8B3;--accent:#4FD1D5;--accent-d:#00696D;--ok:#5BD68A;--warn:#F2C55C;}
  *{box-sizing:border-box;margin:0}
  body{background:#0e0e10;display:grid;place-items:center;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
  .phone{width:412px;height:892px;background:var(--bg);padding:22px 16px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:22px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin:6px 0 2px}
  .health{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14.5px}
  .item:last-child{border-bottom:0}
  .item i{width:10px;height:10px;border-radius:50%;flex:none}
  .ok i{background:var(--ok)}.warn i{background:var(--warn)}
  .item .t{flex:1}
  .item small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .fix{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--warn);background:transparent;color:var(--warn);font:inherit;font-size:13px;cursor:pointer}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .host{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:inherit;font:inherit;cursor:pointer;text-align:left;margin-bottom:8px}
  .host b{font-size:17px;display:block}
  .host span{font-size:13px;color:var(--muted)}
  .go{height:40px;padding:0 16px;border-radius:12px;background:var(--accent-d);display:grid;place-items:center;font-weight:650;font-size:14px}
  .host.off{opacity:.75}
  .host.off .go{background:transparent;border:1px solid var(--line);color:var(--muted)}
</style>
</head>
<body>
<main class="phone">
  <h1>Clipboard Share</h1>

  <h2>Sincronización</h2>
  <section class="health" aria-label="Estado de la sincronización">
    <div class="item ok"><i aria-hidden="true"></i><div class="t">PC → celular<small>Activo · último texto hace 1 min</small></div></div>
    <div class="item ok"><i aria-hidden="true"></i><div class="t">Celular → PC en segundo plano<small>Permiso de registros concedido</small></div></div>
    <div class="item warn"><i aria-hidden="true"></i><div class="t">Acceso a registros<small>Android lo pide al abrir la app</small></div><button class="fix" type="button">Revisar</button></div>
  </section>

  <h2>Dispositivos</h2>
  <button class="host" type="button"><div><b>omarchy</b><span>192.168.0.14 · en red</span></div><span class="go">Abrir</span></button>
  <button class="host off" type="button"><div><b>Portátil de la oficina</b><span>Sin respuesta · ayer</span></div><span class="go">Probar</span></button>
</main>
</body>
</html>
